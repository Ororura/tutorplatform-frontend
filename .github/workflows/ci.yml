name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Critical Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      E2E_BACKEND_CONTEXT: ${{ github.workspace }}/.e2e-dependencies/backend
      E2E_WORKER_CONTEXT: ${{ github.workspace }}/.e2e-dependencies/execution-worker

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7

      - name: Checkout backend main
        uses: actions/checkout@v7
        with:
          repository: Ororura/tutorplatform-backend
          ref: main
          path: .e2e-dependencies/backend

      - name: Checkout execution worker main
        uses: actions/checkout@v7
        with:
          repository: Ororura/tutor-learning-platform-execution-worker
          ref: main
          path: .e2e-dependencies/execution-worker

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        run: docker compose -f .github/e2e/compose.yml up --build --detach --wait --wait-timeout 300

      - name: Verify local backend readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness

      - name: Run critical learning flows
        run: npm run e2e:critical

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Print service logs
        if: failure()
        run: docker compose -f .github/e2e/compose.yml logs --no-color

      - name: Stop isolated E2E environment
        if: always()
        run: docker compose -f .github/e2e/compose.yml down --volumes --remove-orphans

  docker:
    name: Build Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ororura/tutorplatform-frontend:latest
            ghcr.io/ororura/tutorplatform-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/tutorplatform_deploy
          chmod 600 ~/.ssh/tutorplatform_deploy

          ssh-keygen -y -f ~/.ssh/tutorplatform_deploy > /dev/null

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/tutorplatform_deploy \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            cd /opt/tutorplatform

            docker compose pull
            docker compose up -d

            docker image prune -f
          EOF

      - name: Deploy Demo
        run: |
          ssh -i ~/.ssh/tutorplatform_deploy \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            cd /opt/tutorplatform-demo

            docker compose pull
            docker compose up -d

            docker image prune -f
          EOF
