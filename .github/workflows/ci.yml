name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ororura/tutorplatform-frontend

jobs:
  delivery-checks:
    name: Deployment verification tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compile operational scripts
        run: python3 -m compileall -q scripts tests/ops
      - name: Smoke, deployment and Compose regression tests
        run: python3 -m unittest discover -s tests/ops -v
      - name: Validate GitHub Actions and embedded shell
        run: |
          docker run --rm --network none --workdir /repo \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            rhysd/actionlint:1.7.12 .github/workflows/ci.yml

  checks:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Critical Playwright E2E
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      E2E_BACKEND_CONTEXT: ${{ github.workspace }}/.e2e-dependencies/backend
      E2E_WORKER_CONTEXT: ${{ github.workspace }}/.e2e-dependencies/execution-worker

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7

      - name: Checkout backend main
        uses: actions/checkout@v7
        with:
          repository: Ororura/tutorplatform-backend
          ref: main
          path: .e2e-dependencies/backend

      - name: Checkout execution worker main
        uses: actions/checkout@v7
        with:
          repository: Ororura/tutor-learning-platform-execution-worker
          ref: main
          path: .e2e-dependencies/execution-worker

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated E2E environment
        run: docker compose -f .github/e2e/compose.yml up --build --detach --wait --wait-timeout 300

      - name: Verify local backend readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness

      - name: Run critical learning flows
        run: npm run e2e:critical

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Print service logs
        if: failure()
        run: docker compose -f .github/e2e/compose.yml logs --no-color

      - name: Stop isolated E2E environment
        if: always()
        run: docker compose -f .github/e2e/compose.yml down --volumes --remove-orphans

  docker:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    name: Build and scan production image
    needs: [checks, e2e, delivery-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table
          output: trivy-results.txt
          timeout: 10m
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Show Trivy findings
        if: ${{ always() && hashFiles('trivy-results.txt') != '' }}
        run: |
          docker image inspect --format 'Scanned image ID: {{.Id}}' "$IMAGE_NAME:${{ github.sha }}"
          trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --version
          cat trivy-results.txt
          {
            echo '## Production image vulnerabilities (HIGH/CRITICAL)'
            echo '```text'
            cat trivy-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_NAME:${{ github.sha }}" | awk -v repo="$IMAGE_NAME@" 'index($0, repo) == 1 {print; exit}')
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing published image digest'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published commit=${{ github.sha }} repository=$IMAGE_NAME tag=${{ github.sha }} digest=$digest"
          echo "Published image: $IMAGE_NAME:${{ github.sha }}@$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/tutorplatform_deploy
          chmod 600 ~/.ssh/tutorplatform_deploy

          ssh-keygen -y -f ~/.ssh/tutorplatform_deploy > /dev/null

          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/tutorplatform_deploy \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            cd /opt/tutorplatform

            docker compose pull
            docker compose up -d

            docker image prune -f
          EOF

      - name: Deploy Demo
        run: |
          ssh -i ~/.ssh/tutorplatform_deploy \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            cd /opt/tutorplatform-demo

            docker compose pull
            docker compose up -d

            docker image prune -f
          EOF
